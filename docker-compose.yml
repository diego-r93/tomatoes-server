services:
  backend:
    image: tomatoes-backend:node24
    build: ./backend
    container_name: backend
    restart: unless-stopped
    volumes:
      - ./backend:/backend
      - factory_mqtt:/run/tomatoes-mqtt:ro
      - ./mosquitto/config/tls:/run/tomatoes-tls:ro
      - ./mosquitto/config/device-ca.pem:/run/tomatoes-device-ca.pem:ro
      - /etc/dhcpcd.conf:/etc/dhcpcd.conf
      - /etc/dnsmasq.conf:/etc/dnsmasq.conf
      - /etc/wpa_supplicant/wpa_supplicant.conf:/etc/wpa_supplicant/wpa_supplicant.conf
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ""
    ports:
      - "${MQTT_DEVICE_BIND_IP:-127.0.0.1}:8884:8884"
    networks:
      - backend_network
      - nginx_network
      - influxdb_network
      - mosquitto_network
    depends_on:
      - influxdb
      - mosquitto
      - mongo
    env_file:
      - .env

  nginx:
    image: tomatoes-frontend:local
    build: ./frontend
    container_name: nginx_proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - ./nginx/portal-locations.conf:/etc/nginx/portal-locations.conf:ro
      - ./nginx/reload-public-tls.sh:/docker-entrypoint.d/40-public-tls-reload.sh:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - nginx_network
      - backend_network
      - influxdb_network
    env_file:
      - .env
    environment:
      OTA_MASTER_KEY: ""
      CLOUDFLARE_DNS_API_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
    depends_on:
      - backend
      - grafana
      - influxdb

  public-https:
    image: certbot/dns-cloudflare:v5.9.0
    restart: unless-stopped
    entrypoint: ["python", "/opt/public_https.py"]
    environment:
      PUBLIC_HTTPS_ENABLED: ${PUBLIC_HTTPS_ENABLED:-false}
      PUBLIC_HTTPS_DOMAIN: ${PUBLIC_HTTPS_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-false}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:-}
    volumes:
      - ./nginx/public_https.py:/opt/public_https.py:ro
      - ./nginx/acme/config:/etc/letsencrypt
      - ./nginx/acme/work:/var/lib/letsencrypt
      - ./nginx/acme/log:/var/log/letsencrypt
      - ./nginx/tls/public:/public
    tmpfs:
      - /run/acme:mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  mosquitto:
    image: tomatoes-mosquitto:2.1.2
    build: ./mosquitto
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./mosquitto.sh:/mosquitto.sh
      - factory_mqtt:/run/tomatoes-mqtt
    ports:
      - 8883:8883
    networks:
      - mosquitto_network
    environment:
      - MQTT_USER_NAME=${MQTT_USER_NAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TLS_HOST=${MQTT_TLS_HOST:-}
      - MQTT_TLS_ALT_IP=${MQTT_TLS_ALT_IP:-}
      - MQTT_DEVICE_BIND_IP=${MQTT_DEVICE_BIND_IP:-}
    entrypoint: [ "./mosquitto.sh" ]

  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: unless-stopped
    volumes:
      - ./influxdb/data:/var/lib/influxdb2:rw
    networks:
      - influxdb_network
    env_file:
      - .env
    environment:
      OTA_MASTER_KEY: ""
      CLOUDFLARE_DNS_API_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
    entrypoint: [ "./entrypoint.sh" ]

  telegraf:
    image: tomatoes-telegraf:1.40.3-ble
    build: ./telegraf
    # D-Bus authenticates this non-root UID against the host account database.
    user: "${TELEGRAF_UID:-65534}:${TELEGRAF_GID:-65534}"
    container_name: telegraf
    restart: unless-stopped
    volumes:
      - ${TELEGRAF_CFG_PATH}:/etc/telegraf/telegraf.conf:rw
      # Bleak uses the host BlueZ service through D-Bus.
      - ${BATTERY_DBUS_PATH:-/run/dbus}:/run/dbus:ro
      # Read host Wi-Fi statistics from the host network namespace.
      - /proc/1/net/wireless:/host-proc/net/wireless:ro
      # Use the Raspberry Pi utility without modifying the host executable.
      - /usr/bin/vcgencmd:/usr/bin/vcgencmd:ro
    devices:
      # vcgencmd opens this device read-only to query the firmware.
      - /dev/vcio:/dev/vcio:r
    group_add:
      # Host video group: grants access to /dev/vcio (GID 44).
      - "44"
    networks:
      - influxdb_network
      - mosquitto_network
    env_file:
      - .env
      - path: ./telegraf/.mqtt.env
        required: false
    environment:
      OTA_MASTER_KEY: ""
      CLOUDFLARE_DNS_API_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
    depends_on:
      - influxdb

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana:rw
    networks:
      - influxdb_network   
    env_file:
      - .env
    environment:
      OTA_MASTER_KEY: ""
      CLOUDFLARE_DNS_API_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://192.168.1.30/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    depends_on:
      - influxdb
  
  mongo:
    platform: linux/arm64
    image: mongo:4.4.18
    container_name: mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - ./mongo/data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1 || mongo --quiet -u \"$MONGO_INITDB_ROOT_USERNAME\" -p \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: mongo_express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD}
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_BASIC_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_BASIC_PASS}
    networks:
      - backend_network

volumes:
  factory_mqtt:
  influxdb_data:
  grafana_data:

networks:
  backend_network:
  nginx_network:
  influxdb_network:
  mosquitto_network: