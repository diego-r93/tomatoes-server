# Telegraf configuration for tomatoes-server.
# Only enabled plugins are included. Lines starting with # are comments.
# Keep the current collection settings, data types, and destinations.
# Environment variables are supplied to the container by Docker Compose.

# Tags added to all metrics. No custom tags are set.
[global_tags]

# Default collection and write settings.
[agent]
  # Collect periodic inputs every 10 seconds.
  interval = "10s"
  round_interval = true
  # Maximum number of metrics in each write batch.
  metric_batch_size = 1000
  # Maximum number of pending metrics per output.
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  # Write buffered metrics every 10 seconds.
  flush_interval = "10s"
  flush_jitter = "0s"
  # Use automatic timestamp precision.
  precision = "0s"
  # Add host=raspberrypi to collected metrics.
  hostname = "raspberrypi"
  omit_hostname = false

# Send all collected metrics to InfluxDB. Credentials come from the environment.
[[outputs.influxdb_v2]]
  urls = ["http://${DOCKER_INFLUXDB_INIT_HOST}:8086"]
  token = "${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}"
  organization = "${DOCKER_INFLUXDB_INIT_ORG}"
  bucket = "${DOCKER_INFLUXDB_INIT_BUCKET}"

# Collect CPU usage for each CPU and the total.
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false

# Collect filesystem usage, excluding the filesystem types listed below.
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Collect disk read and write statistics.
[[inputs.diskio]]

# Collect kernel statistics.
[[inputs.kernel]]

# Collect memory usage.
[[inputs.mem]]

# Collect process counts and states.
[[inputs.processes]]

# Collect swap usage.
[[inputs.swap]]

# Collect system load and uptime.
[[inputs.system]]

# Read Raspberry Pi temperature using vcgencmd.
[[inputs.exec]]
  commands = [ "/usr/bin/vcgencmd measure_temp"]
  name_override = "gpu_temperature"
  data_format = "grok"
  grok_patterns = ["%{NUMBER:value:float}"]

# Read the ARM clock frequency using vcgencmd.
[[inputs.exec]]
  commands = ["/usr/bin/vcgencmd measure_clock arm"]
  name_override = "cpu_clock"
  data_format = "grok"
  grok_patterns = ["=%{NUMBER:value:float}"]

# Read voltage using vcgencmd.
[[inputs.exec]]
  commands = [ "/usr/bin/vcgencmd measure_volts"]
  name_override = "volts"
  data_format = "grok"
  grok_patterns = ["%{NUMBER:value:float}"]

# Read the thermal sensor as an integer. Keep its original unit.
[[inputs.file]]
  files = ["/sys/class/thermal/thermal_zone0/temp"]
  name_override = "cpu_temperature"
  data_format = "value"
  data_type = "integer"

# Collect network interface statistics.
[[inputs.net]]

# Receive sensor messages over MQTT and store each payload as a string.
[[inputs.mqtt_consumer]]
servers = ["tcp://192.168.0.100:1883"]
topics = [
    "sensors/#"  # Receive all topics under sensors/
  ]
data_format = "value"
data_type = "string"
  username = "${MQTT_USER_NAME}"
  password = "${MQTT_PASSWORD}"
